<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Free Token Gateway</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <h1>Free Token Gateway</h1>
        </div>
        <div id="wireBadge" class="badge">…</div>
      </header>

      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="catalog">商家目录</button>
        <button type="button" class="tab" data-tab="connections">我的连接</button>
        <button type="button" class="tab" data-tab="strategy">策略与状态</button>
      </nav>

      <section id="panel-catalog" class="panel active">
        <div class="filters">
          <button type="button" class="chip active" data-tier="all">全部</button>
          <button type="button" class="chip" data-tier="free">免费</button>
          <button type="button" class="chip" data-tier="trial">试用</button>
          <button type="button" class="chip" data-tier="cheap">廉价</button>
          <button type="button" class="chip" data-tier="paid">付费/自定义</button>
        </div>
        <div id="catalogList" class="cards"></div>
      </section>

      <section id="panel-connections" class="panel">
        <p class="lead">已连接的账户会参与轮换。额度触发限流时自动冷却并切换下一家。</p>
        <div id="connList" class="stack"></div>
      </section>

      <section id="panel-strategy" class="panel">
        <div class="card">
          <h2>轮换策略</h2>
          <label class="field">
            <span>模式</span>
            <select id="strategyMode">
              <option value="priority">按优先级（数字越小越先）</option>
              <option value="round_robin">轮询可用连接</option>
            </select>
          </label>
          <label class="check">
            <input type="checkbox" id="preferFree" />
            优先使用 free / trial 层
          </label>
          <label class="field">
            <span>限流冷却（秒）</span>
            <input id="cooldownSeconds" type="number" min="30" max="3600" />
          </label>
          <label class="field">
            <span>模型级冷却（秒）</span>
            <input id="modelCooldownSeconds" type="number" min="30" max="3600" />
          </label>
          <label class="field">
            <span>默认模型</span>
            <select id="defaultModel"></select>
          </label>
          <label class="check">
            <input type="checkbox" id="injectPhysicalModels" />
            接线时同时注入物理模型 id（高级；默认只注入 auto-text / auto-vision）
          </label>
          <button type="button" id="btnSaveStrategy" class="btn primary">保存策略并重新接线</button>
        </div>
        <div class="card">
          <h2>路由池</h2>
          <ul id="routeList" class="status-list"></ul>
          <p class="muted small">日常选 auto-text；看图选 auto-vision（或 auto-text 带图时自动升视觉池）。额度用尽会在同模态池内换连接并改写上游模型。</p>
        </div>
        <div class="card">
          <h2>Agent 接线</h2>
          <ul id="statusList" class="status-list"></ul>
          <p class="muted small">改写后请重新打开 DSH / OpenCode。</p>
          <div class="row">
            <button type="button" id="btnRewire" class="btn">重新接线</button>
          </div>
        </div>
        <details class="card">
          <summary>高级</summary>
          <label class="field">
            <span>本机端口</span>
            <input id="port" type="number" min="1024" max="65535" />
          </label>
          <label class="field">
            <span>网关本地 Key</span>
            <div class="row">
              <input id="localApiKey" readonly />
              <button type="button" id="btnCopyKey" class="btn ghost">复制</button>
            </div>
          </label>
          <button type="button" id="btnSaveAdvanced" class="btn">保存高级设置</button>
        </details>
      </section>

      <p id="toast" class="toast" hidden></p>
    </main>

    <dialog id="connectDialog">
      <form id="connectForm" class="dialog">
        <h3 id="connectTitle">填入密钥</h3>
        <p id="connectHint" class="muted small"></p>
        <input type="hidden" id="connProviderId" />
        <label class="field">
          <span>显示名称</span>
          <input id="connLabel" required />
        </label>
        <label class="field" id="baseUrlField">
          <span>Base URL</span>
          <input id="connBaseUrl" />
        </label>
        <label class="field">
          <span>API Key</span>
          <input id="connApiKey" type="password" required autocomplete="off" />
        </label>
        <label class="field">
          <span>模型 id（逗号分隔）</span>
          <input id="connModels" placeholder="例如 llama-3.3-70b-versatile" />
        </label>
        <label class="field">
          <span>优先级（越小越先）</span>
          <input id="connPriority" type="number" value="10" />
        </label>
        <div class="row end">
          <button type="button" id="btnConnectCancel" class="btn ghost" value="cancel">取消</button>
          <button type="submit" class="btn primary">保存连接</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
